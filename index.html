<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>放鬆小夥伴 Relax Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EDE6; --ink:#46525A; --muted:#7C8B93; --line:rgba(70,82,90,.12);
  --sage:#8FA39D; --sage-d:#6F857E; --sage-l:#DCE6E2;
  --coral:#E8836B; --coral-l:#F8DDD4;
  --card:rgba(255,255,255,.74); --card-solid:#FFFDFA;
  --r:22px; --shadow:0 10px 30px rgba(70,82,90,.10), 0 2px 6px rgba(70,82,90,.06);
  --font:"Nunito","PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1}
.fixed{position:fixed;inset:0;z-index:5}

/* ---------- Home ---------- */
#home{min-height:100%;padding:24px 16px 40px;display:flex;justify-content:center}
.home-card{width:100%;max-width:760px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);border-radius:28px;box-shadow:var(--shadow);padding:28px clamp(16px,4vw,36px) 28px}
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:.02em;color:#56656D}
.brand p{margin:6px 0 0;color:var(--muted);font-size:17px}
.brand p span{display:inline-block;white-space:nowrap;margin-right:1.3em}
.brand p b{color:var(--coral);font-weight:800}
.brand p i{font-style:normal;color:var(--sage-d);font-weight:800}
.lang-btn{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.section{margin-top:26px}
.section h2{margin:0 0 12px;font-size:17px;font-weight:800;color:#56656D}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.tile{position:relative;border:2px solid transparent;background:#fff;border-radius:20px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(70,82,90,.06);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px)}
.tile[aria-pressed="true"]{border-color:var(--sage);box-shadow:0 0 0 4px var(--sage-l)}
.tile .pic{width:84px;height:84px;display:grid;place-items:center}
.tile .pic svg,.tile .pic img{width:100%;height:100%;object-fit:contain}
.tile .nm{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:150px;padding:14px 8px 12px;gap:10px}.tile .pic{width:76px;height:76px}.tile .nm{font-size:16px;line-height:1.35;min-height:1.35em;position:relative;z-index:1}}
.tile.upload .pic{border:2px dashed #C6D1CD;border-radius:16px;color:var(--sage-d)}
.tile.upload .pic svg{width:34px;height:34px}
.custom-panel{margin-top:14px;background:#fff;border-radius:18px;padding:14px 16px;display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{font-weight:700;font-size:15px}
.text-in{flex:1;min-width:160px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#FBFAF8;font-size:16px}
.hint{color:var(--muted);font-size:14px;margin:0;line-height:1.5}
.btn{border:none;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--sage-l);color:var(--sage-d)}
.btn:hover{filter:brightness(.97)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;border:2px solid transparent;background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 2px 8px rgba(70,82,90,.06)}
.mode[aria-pressed="true"]{border-color:var(--sage);box-shadow:0 0 0 4px var(--sage-l)}
.mode b{display:block;font-size:18px;font-weight:800;margin-bottom:4px}
.mode span{color:var(--muted);font-size:14.5px;line-height:1.45}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;gap:4px;box-shadow:0 2px 8px rgba(70,82,90,.06)}
.seg button{border:none;background:transparent;border-radius:999px;padding:9px 18px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sage);color:#fff}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#D5DCD9;position:relative;transition:background .2s;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked{background:var(--sage)}
.switch input:checked::after{transform:translateX(18px)}
.start-wrap{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.start{border:none;background:var(--sage);color:#fff;font-size:21px;font-weight:800;border-radius:999px;padding:16px 56px;box-shadow:0 10px 24px rgba(111,133,126,.35);transition:transform .15s,background .15s}
.start:hover{background:var(--sage-d);transform:scale(1.03)}
.privacy{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13.5px;line-height:1.5;max-width:520px;text-align:left}
.privacy svg{flex:none;width:18px;height:18px;margin-top:1px}

/* ---------- Loading / error ---------- */
.center-screen{display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.spinner{width:58px;height:58px;border-radius:50%;border:5px solid var(--sage-l);border-top-color:var(--sage);animation:spin 1s linear infinite;margin:0 auto 22px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg-card{background:var(--card-solid);border-radius:26px;box-shadow:var(--shadow);padding:30px 26px;max-width:460px;width:100%}
.msg-card h2{margin:0 0 10px;font-size:22px}
.msg-card p{margin:0 0 20px;color:var(--muted);line-height:1.6}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn.primary{background:var(--sage);color:#fff}

/* ---------- Run ---------- */
#run{display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.75);display:grid;place-items:center;box-shadow:0 2px 8px rgba(70,82,90,.08);flex:none}
.icon-btn svg{width:22px;height:22px;color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--sage);}
.icon-btn[aria-pressed="true"] svg{color:#fff}
.dots{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(111,133,126,.22);transition:all .3s}
.dots i.done{background:var(--sage)}
.dots i.cur{background:var(--coral);transform:scale(1.35)}
.spacer{flex:1}
.stage-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 16px}
#stage{position:relative;width:min(58vmin,420px,calc(100dvh - 330px));aspect-ratio:1;min-width:190px}
#ring,#sparks{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#ring{transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:2.2}
#ring .track{stroke:rgba(111,133,126,.14)}
#ring .val{stroke:var(--sage);stroke-linecap:round;stroke-dasharray:289.03;stroke-dashoffset:289.03}
#sparks path{stroke:var(--coral);stroke-width:2.2;stroke-linecap:round;fill:none}
#charWrap{position:absolute;left:14%;top:12%;width:72%;height:72%;transform-origin:50% 92%;will-change:transform}
#charWrap svg,#charWrap img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
#bubbleLayer{position:absolute;inset:0;pointer-events:none;overflow:visible}
.bub{position:absolute;bottom:18%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(186,214,206,.55) 60%,rgba(186,214,206,.15));animation:rise var(--d,4s) ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--dx,0px),-190%) scale(1.1)}}
.speech{position:absolute;right:-4%;top:-2%;background:#fff;border-radius:18px;padding:9px 14px;font-weight:800;font-size:clamp(14px,2.4vmin,18px);box-shadow:var(--shadow);opacity:0;transform:translateY(6px) scale(.95);transition:opacity .3s,transform .3s;max-width:62%;pointer-events:none}
.speech::after{content:"";position:absolute;left:18px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.speech.show{opacity:1;transform:none}
.hand-pill{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:rgba(70,82,90,.82);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;white-space:nowrap;transition:opacity .3s}
.hand-pill svg{width:18px;height:18px}
.card-area{display:flex;justify-content:center;padding:6px 16px calc(18px + env(safe-area-inset-bottom))}
#card{width:100%;max-width:600px;background:var(--card-solid);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 20px 16px;border-top:5px solid var(--sage);transition:border-color .4s}
#card.hot{border-top-color:var(--coral)}
.step-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.step-label{font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.03em}
.det-chip{font-size:12.5px;font-weight:800;color:var(--sage-d);background:var(--sage-l);border-radius:999px;padding:4px 10px;white-space:nowrap}
#mainText{margin:0;font-size:clamp(17px,2.6vmin,22px);line-height:1.5;font-weight:700;min-height:3em}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
#statusText{font-weight:800;color:var(--sage-d);font-size:17px}
#card.hot #statusText{color:var(--coral)}
#countNum{font-size:34px;font-weight:800;min-width:1.5em;text-align:right;color:var(--coral);font-variant-numeric:tabular-nums;line-height:1}
#countNum.soft{color:var(--sage);font-size:26px}
#camBox{position:fixed;left:16px;bottom:16px;width:150px;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#DCD6CE;box-shadow:var(--shadow);opacity:.62;transition:opacity .2s;z-index:6}
#camBox:hover{opacity:1}
#camCanvas{width:100%;height:100%;display:block}
#camBox .dot{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#C9C2B8;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
#camBox .dot.on{background:#7CC49A}
.pause-veil{position:absolute;inset:0;display:grid;place-items:center;background:rgba(242,237,230,.6);border-radius:50%;font-weight:800;font-size:22px;color:var(--sage-d)}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(242,237,230,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{background:var(--card-solid);border-radius:28px;box-shadow:var(--shadow);padding:28px 24px;max-width:560px;width:100%;text-align:center;max-height:100%;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:clamp(20px,3.4vw,26px)}
.sheet p{margin:0 0 18px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 18px}
.scale button{border:2px solid transparent;background:#F6F3EF;border-radius:18px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px;line-height:1.2;transition:transform .15s}
.scale button:hover{transform:translateY(-2px);border-color:var(--sage-l)}
.scale svg{width:44px;height:44px}
.done-pic{width:150px;height:150px;margin:0 auto 6px}
.done-pic svg,.done-pic img{width:100%;height:100%;object-fit:contain}
.compare{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 22px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;background:#F6F3EF;border-radius:18px;padding:10px 16px;min-width:108px}
.chip small{color:var(--muted);font-weight:700}
.chip svg{width:40px;height:40px}
.chip b{font-size:14px}
.arrow{font-size:26px;color:var(--muted)}
.settings-list{display:grid;gap:16px;text-align:left;margin:14px 0 22px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.set-row label{font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:6px;background:#F6F3EF;border-radius:999px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:50%;border:none;background:#fff;font-weight:800;font-size:18px}
.stepper output{min-width:3.2em;text-align:center;font-weight:800}

@media (max-width:600px){
  #camBox{width:104px;left:12px;bottom:auto;top:calc(68px + env(safe-area-inset-top))}
  .speech{right:-2%}
  #stage{width:min(84vw,calc(100dvh - 360px))}
  .topbar{gap:6px;padding:10px 12px}
  .icon-btn{width:38px;height:38px}
  .icon-btn svg{width:19px;height:19px}
  .dots{gap:5px}
  .dots i{width:8px;height:8px}
}
@media (prefers-reduced-motion:reduce){
  .tile,.start{transition:none}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- ============ HOME ============ -->
<section id="home" class="screen">
  <div class="home-card">
    <div class="home-head">
      <div class="brand">
        <h1 data-t="appName"></h1>
        <p id="tagline"></p>
      </div>
      <button class="lang-btn" id="langBtn" type="button"></button>
    </div>

    <div class="section">
      <h2 data-t="pickChar"></h2>
      <div class="tiles" id="tiles"></div>
      <div class="custom-panel" id="customPanel" hidden>
        <div class="row">
          <label for="customName" data-t="charName"></label>
          <input class="text-in" id="customName" maxlength="12" autocomplete="off">
        </div>
        <div class="row" style="justify-content:space-between">
          <label class="switch"><input type="checkbox" id="removeBg"><span data-t="removeBg"></span></label>
          <button class="btn" type="button" id="changeImg" data-t="change"></button>
        </div>
        <p class="hint" data-t="uploadHint"></p>
      </div>
      <input type="file" id="fileIn" accept="image/*" hidden>
    </div>

    <div class="section">
      <h2 data-t="modeTitle"></h2>
      <div class="modes">
        <button class="mode" type="button" data-mode="guided"><b data-t="guided"></b><span data-t="guidedDesc"></span></button>
        <button class="mode" type="button" data-mode="free"><b data-t="free"></b><span data-t="freeDesc"></span></button>
      </div>
      <div class="row" id="freeDetRow" style="margin-top:12px" hidden>
        <label data-t="freeDetTitle"></label>
        <div class="seg" id="freeDetSeg">
          <button type="button" data-fdet="hand" data-t="fdHand"></button>
          <button type="button" data-fdet="face" data-t="fdFace"></button>
          <button type="button" data-fdet="shrug" data-t="fdShrug"></button>
        </div>
      </div>
    </div>

    <div class="section">
      <h2 data-t="soundTitle"></h2>
      <div class="row" style="gap:18px">
        <div class="seg" id="soundSeg">
          <button type="button" data-sound="wind" data-t="wind"></button>
          <button type="button" data-sound="music" data-t="music"></button>
          <button type="button" data-sound="off" data-t="mute"></button>
        </div>
        <label class="switch"><input type="checkbox" id="voiceOn"><span data-t="voice"></span></label>
        <button class="btn" type="button" id="homeSettings" data-t="settings"></button>
      </div>
    </div>

    <div class="start-wrap">
      <button class="start" id="startBtn" type="button" data-t="start"></button>
      <p class="hint" data-t="howto" style="text-align:center"></p>
      <div class="privacy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span data-t="privacy"></span>
      </div>
    </div>
  </div>
</section>

<!-- ============ LOADING ============ -->
<section id="loading" class="screen fixed center-screen" hidden>
  <div>
    <div class="spinner"></div>
    <h2 style="margin:0 0 6px" data-t="loading"></h2>
    <p class="hint" data-t="loadingSub"></p>
  </div>
</section>

<!-- ============ ERROR ============ -->
<section id="error" class="screen fixed center-screen" hidden>
  <div class="msg-card">
    <h2 id="errTitle"></h2>
    <p id="errMsg"></p>
    <div class="btn-row">
      <button class="btn" type="button" id="errBack" data-t="back"></button>
      <button class="btn primary" type="button" id="errRetry" data-t="retry"></button>
    </div>
  </div>
</section>

<!-- ============ RUN ============ -->
<section id="run" class="screen fixed" hidden>
  <div class="topbar">
    <button class="icon-btn" id="exitBtn" type="button" data-label="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="dots" id="dots"></div>
    <div class="spacer" id="spacer" hidden></div>
    <button class="icon-btn" id="pauseBtn" type="button" data-label="pause">
      <svg id="pauseIco" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
    <button class="icon-btn" id="skipBtn" type="button" data-label="skipStep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l9 7-9 7z" fill="currentColor"/><path d="M19 5v14"/></svg>
    </button>
    <button class="icon-btn" id="muteBtn" type="button" data-label="mute">
      <svg id="muteIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <button class="icon-btn" id="runSettings" type="button" data-label="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="stage-area">
    <div id="stage">
      <svg id="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="val" id="ringVal" cx="50" cy="50" r="46"/></svg>
      <svg id="sparks" viewBox="0 0 100 100"></svg>
      <div id="charWrap"></div>
      <div id="bubbleLayer"></div>
      <div class="speech" id="speech"></div>
      <div class="hand-pill" id="handPill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        <span id="handPillText"></span>
      </div>

async function fileToDataURL(file){
  const url = URL.createObjectURL(file);

    const im = await loadImg(url);

    const cv = document.createElement('canvas'); cv.width = Math.round(im.width*sc); cv.height = Math.round(im.height*sc);

}

    if (p[i-4+3]===0 || p[i+4+3]===0 || p[i-W*4+3]===0 || p[i+W*4+3]===0) p[i+3] = Math.min(p[i+3], 150);

class Sound{
  constructor(){ this.ctx=null; this.nodes=[]; this.mode='off'; this.t=0; this.bellTimer=null; }
  ensure(){
    if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.75; this.master.connect(this.ctx.destination); }
    if (this.ctx.state === 'suspended') this.ctx.resume();

  }
  clear(){ this.nodes.forEach(n => { try{ n.stop && n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} }); this.nodes=[]; clearInterval(this.bellTimer); this.bellTimer=null; this.bus=null; }
  setMode(mode){

      let last = 0; for (let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = last*3.5 + w*0.15; }

      const g = c.createGain(); g.gain.value = 0.25;

    } else if (mode === 'music'){
      const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 900; lp.Q.value = 0.5;
      const trem = c.createGain(); trem.gain.value = 1;
      const tl = c.createOscillator(), tg = c.createGain(); tl.frequency.value = 5.5; tg.gain.value = 0; tl.connect(tg).connect(trem.gain); tl.start();
      const out = c.createGain(); out.gain.value = 0.0; out.gain.linearRampToValueAtTime(0.55, now + 2);
      lp.connect(trem).connect(out).connect(this.master);
      const det = [];

        const o1 = c.createOscillator(); o1.type='triangle'; o1.frequency.value=f;
        const o2 = c.createOscillator(); o2.type='sine'; o2.frequency.value=f*2;
        const g = c.createGain(); g.gain.value = 0.055;

      this.music = {lp, tg, det}; this.bus = out; this.nodes.push(lp, trem, tl, tg, out);
      const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.5];
      this.bellTimer = setInterval(() => { if (this.t < 0.3 && Math.random() < 0.7) this.bell(scale[(Math.random()*scale.length)|0], 0.05); }, 2200);
    }
  }
  setTension(t){
    this.t = t; if (!this.ctx) return; const now = this.ctx.currentTime;
    if (this.mode === 'wind' && this.wind){
      this.wind.bp.frequency.setTargetAtTime(380 + 1700*t, now, 0.12);
      this.wind.g.gain.setTargetAtTime(0.22 + 0.9*t, now, 0.15);
    } else if (this.mode === 'music' && this.music){
      this.music.lp.frequency.setTargetAtTime(800 + 2600*t, now, 0.15);
      this.music.tg.gain.setTargetAtTime(0.45*t, now, 0.15);
      this.music.det.forEach(o => o.detune.setTargetAtTime(28*t, now, 0.2));

  }
  chime(){ this.bell(659.25, 0.09); setTimeout(() => this.bell(987.77, 0.07), 180); }
  stop(){ this.clear(); }
}

let curDet = 'hand';

function setDet(k){

const GAIN = { strict:0.8, normal:1, easy:1.35 };

// HAND — curl of the four fingers: fingertip-to-wrist ÷ knuckle-to-wrist.
// Checked on sample photos: open hands ≈ 1.64–1.80, fists ≈ 0.66–0.77.
const FIST_RATIO = { strict:0.9, normal:1.05, easy:1.25 };
function handTension(lm){
  const w = video.videoWidth || 640, h = video.videoHeight || 480;
  const P = i => [lm[i].x*w, lm[i].y*h, lm[i].z*w];
  const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
  const wr = P(0); let sum = 0;
  for (const [tip, mcp] of [[8,5],[12,9],[16,13],[20,17]]) sum += dist(P(tip), wr) / Math.max(1e-6, dist(P(mcp), wr));

// FACE — "scrunch score" from blendshapes (0…1): mostly frown + squint, a little pressed lips / nose.
// Smiling also raises eyeSquint, so squint is discounted by the smile amount.
// Checked on sample photos: neutral 0.01–0.15 (varies by person → calibration), smiles ≈ 0.03,
// strong disgust/scrunch ≈ 0.4–0.65.
function faceScore(){
  const f = obs.face; if (!f) return null;
  const a = k => ((f[k+'Left'] || 0) + (f[k+'Right'] || 0)) / 2;
  return 0.45*a('browDown') + 0.35*Math.max(0, a('eyeSquint') - 0.4*a('mouthSmile')) + 0.1*a('mouthPress') + 0.1*a('noseSneer');

  if (!ears.length) return null;
  const earY = ears.reduce((s,i) => s + L[i].y, 0) / ears.length;
  const sw = Math.hypot((L[11].x-L[12].x)*w, (L[11].y-L[12].y)*h);
  return ((L[11].y + L[12].y)/2 - earY) * h / Math.max(1, sw);

// ARMS — elbow bent AND fist lifted above the elbow ("strongman" pose). No calibration needed.

  let best = 0;
  for (const [s,e,wr] of [[11,13,15],[12,14,16]]){
    if (L[e].visibility < 0.5 || L[wr].visibility < 0.5) continue;
    const u = [W[s].x-W[e].x, W[s].y-W[e].y, W[s].z-W[e].z], v = [W[wr].x-W[e].x, W[wr].y-W[e].y, W[wr].z-W[e].z];

/* ---------------- Personal baseline (calibration) ---------------- */
// Face and shoulders differ a lot between students, so we measure each student's relaxed
// "normal" for ~2.5 s and count only the change from it. The baseline also drifts toward the

  if (calib) return;
  const k = curDet;

  if (base[k] === null) base[k] = rawS;                       // no calibration happened — start from now
  else if (k === 'face' && rawS < base[k]) base[k] = lerp(base[k], rawS, drift);    // more relaxed than baseline → move toward it

const sprite = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.4,'rgba(255,255,255,.5)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,64,64); return c; })();
for (let i=0;i<110;i++) parts.push({ a:Math.random()*Math.PI*2, r:0.15 + Math.pow(Math.random(),0.7)*0.75, s:6 + Math.random()*22, sp:(Math.random()*2-1)*0.05, ph:Math.random()*10, hue:Math.random() });
function drawBg(dt, time, t){
  const cx = BW/2, cy = BH*0.42, R = Math.hypot(BW,BH)*0.55;
  const g = bctx.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0, mixHex('#F6F2EC','#FBE4DA', t)); g.addColorStop(1, mixHex('#E4ECE9','#EFD9CF', t*0.8));
  bctx.fillStyle = g; bctx.fillRect(0,0,BW,BH);
  const calmA = hex2rgb('#8FB3AA'), calmB = hex2rgb('#A7BFD6'), hot = hex2rgb('#EE9A80');
  for (const p of parts){
    p.a += p.sp*dt*(1 + t*3);
    const rr = p.r * (1 - 0.5*t) * R * 0.85;
    const jit = t*t*4;
    const x = cx + Math.cos(p.a)*rr + Math.sin(time*1.3 + p.ph)*10*(1-t) + (Math.random()-.5)*jit;
    const y = cy + Math.sin(p.a)*rr*0.75 + Math.cos(time*1.1 + p.ph)*10*(1-t) + (Math.random()-.5)*jit;
    const base = calmA.map((v,i) => lerp(v, calmB[i], p.hue));
    const col = base.map((v,i) => Math.round(lerp(v, hot[i], t)));
    const sz = p.s * (1 + 0.25*Math.sin(time*0.8 + p.ph)) * (1 - 0.3*t);
    bctx.globalAlpha = 0.22 + 0.18*t;
    bctx.drawImage(tintSprite(col), x - sz, y - sz, sz*2, sz*2);
  }
  bctx.globalAlpha = 1;
}
const tintCache = new Map();
function tintSprite(rgb){
  const key = rgb.map(v => v>>3).join(','); let c = tintCache.get(key); if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.drawImage(sprite,0,0); x.globalCompositeOperation = 'source-in'; x.fillStyle = `rgb(${rgb.join(',')})`; x.fillRect(0,0,64,64);
  if (tintCache.size > 400) tintCache.clear(); tintCache.set(key, c); return c;
}

/* ---------------- Run-screen character ---------------- */
let charEl = null, faceParts = null, calmFor = 0, blinkAt = 2, lastSpeechAt = -10, wasTense = false;
const ringVal = $('#ringVal'), RC = 289.03;
function mountCharacter(){
  const wrap = $('#charWrap'); wrap.innerHTML = '';
  if (S.charId === 'custom' && S.customImg){
    const im = document.createElement('img'); im.alt = ''; im.src = customProcessed || S.customImg; wrap.appendChild(im); faceParts = null;
  } else {
    if (S.charId === 'custom') S.charId = 'puff';
    wrap.innerHTML = charSVG(S.charId);
    const q = s => wrap.querySelectorAll(s);
    faceParts = { body:q('.bodyfill')[0], open:q('.f-open')[0], happy:q('.f-happy')[0], squeeze:q('.f-squeeze')[0],
                   smile:q('.m-smile')[0], tense:q('.m-tense')[0], cheeks:[...q('.cheek')], sweat:q('.sweat')[0], base:CHARS[S.charId].color };
  }
  charEl = wrap;
  // tension marks around the character
  const sp = $('#sparks'); let h = '';
  for (let k=0;k<8;k++){ const a = (k/8)*Math.PI*2 + Math.PI/8, r1 = 40, r2 = 47, x1 = 50+Math.cos(a)*r1, y1 = 50+Math.sin(a)*r1, x2 = 50+Math.cos(a)*r2, y2 = 50+Math.sin(a)*r2;
    h += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" opacity="0"/>`; }
  sp.innerHTML = h;
}
function updateCharacter(dt, time, t){
  if (!charEl) return;
  const sx = 1 + 0.10*t, sy = 1 - 0.13*t;
  const trem = t > 0.35 ? Math.sin(time*42) * 4.5 * (t-0.35)/0.65 : 0;
  const floatY = Math.sin(time*1.1) * 7 * (1-t);
  const breath = 1 + Math.sin(time*0.9) * 0.025 * (1-t);
  charEl.style.transform = `translate(${trem.toFixed(2)}px, ${(floatY + t*8).toFixed(2)}px) scale(${(sx*breath).toFixed(4)}, ${(sy*breath).toFixed(4)})`;
  const glow = t > 0.05 ? `drop-shadow(0 0 ${(6+18*t).toFixed(1)}px rgba(232,131,107,${(0.55*t).toFixed(2)}))` : '';
  charEl.style.filter = `drop-shadow(0 10px 16px rgba(70,82,90,.12)) ${glow}`;
  calmFor = t < 0.18 ? calmFor + dt : 0;
  if (faceParts){
    const F = faceParts, tense = t > 0.55, happy = !tense && calmFor > 1.2;
    F.body.setAttribute('fill', mixHex(F.base, WARM, 0.5*t));
    F.squeeze.setAttribute('opacity', tense ? 1 : 0);
    F.tense.setAttribute('opacity', tense ? 1 : 0);
    F.smile.setAttribute('opacity', tense ? 0 : 1);
    F.happy.setAttribute('opacity', happy ? 1 : 0);
    let eyeScale = 1; blinkAt -= dt; if (blinkAt < 0){ eyeScale = 0.1; if (blinkAt < -0.12) blinkAt = 2.5 + Math.random()*3; }
    F.open.setAttribute('opacity', (!tense && !happy) ? 1 : 0);
    F.open.setAttribute('transform', `scale(1 ${eyeScale})`);
    F.cheeks.forEach(c => c.setAttribute('opacity', (0.3 + 0.55*t).toFixed(2)));
    F.sweat.setAttribute('opacity', clamp((t-0.65)/0.2).toFixed(2));
  }
  // ring & sparks
  ringVal.style.strokeDashoffset = (RC*(1 - t)).toFixed(1);
  ringVal.style.stroke = mixHex('#8FA39D', '#E8836B', clamp(t*1.3));
  const so = clamp((t-0.35)/0.4);
  $$('#sparks path').forEach((p,k) => { p.setAttribute('opacity', (so * (0.6 + 0.4*Math.sin(time*14 + k))).toFixed(2)); });
  // bubbles when relaxed
  bubbleClock -= dt;
  if (t < 0.22 && bubbleClock < 0){ spawnBubble(); bubbleClock = 0.55 + Math.random()*0.5; }
  // speech bubble on crossings
  if (t > 0.72 && !wasTense){ wasTense = true; say(pick(T('tenseLines'))); }
  if (t < 0.15 && wasTense){ wasTense = false; say(pick(T('relaxLines'))); }
}

/* ---------------- Guided session ---------------- */
let G = null;          // guided state
let F = null;          // free-mode state
let ratings = { before:null, after:null };
const P = (key, vars) => { let s = STR[S.lang].det[(G && G.det) || (F && F.det) || 'hand'][key]; for (const v in (vars||{})) s = s.replaceAll(`{${v}}`, vars[v]); return s; };
function show(id){ ['home','loading','error','run'].forEach(s => $('#'+s).hidden = s !== id); document.body.style.overflow = id === 'home' ? '' : 'hidden'; }
function setCard({label='', main='', status='', count='', hot=false, soft=false, det=null}){
  $('#stepLabel').textContent = label; $('#mainText').textContent = main; $('#statusText').textContent = status;
  const cn = $('#countNum'); cn.textContent = count; cn.classList.toggle('soft', soft);
  $('#card').classList.toggle('hot', hot);
  const chip = $('#detChip'); chip.hidden = !det; if (det) chip.textContent = T('watching', {d:T('detName')[det]});
}
function renderDots(){
  const d = $('#dots'); d.innerHTML = '';
  if (S.mode !== 'guided') return;
  STEPS.forEach((_,k) => { const i = document.createElement('i'); if (G && k < G.i) i.className = 'done'; if (G && k === G.i) i.className = 'cur'; d.appendChild(i); });
}
function stepText(){
  const s = STEPS[G.i][S.lang];
  return { title:s.title, relax:s.relax, tense: (G.det === 'hand' && s.tenseFist) ? s.tenseFist : s.tense };
}
function beginStep(){
  G.want = S.autoDet ? STEPS[G.i].det : 'hand';
  G.det = null; renderDots();
  G.label = T('step', {i:G.i+1, n:STEPS.length, title:STEPS[G.i][S.lang].title});
  if (modelReady(G.want)) return useDet(G.want);
  if (modelFailed(G.want) && G.want !== 'hand') return useDet('hand');
  ensureModel(MODEL_OF[G.want]).catch(() => {});

}
function useDet(k){
  G.det = k; setDet(k);
  if (NEEDS_CALIB[k] && base[k] === null){ startCalib(k); go('calib'); }
  else go('intro');
}
function go(phase){
  G.phase = phase; G.t = 0;
  const st = G.det ? stepText() : null;
  if (phase === 'calib'){ speak(T('calibMain')[G.det].replaceAll('{name}', buddyName())); }
  if (phase === 'intro'){ speak(`${st.title}${S.lang === 'zh' ? '。' : '. '}${st.tense}`); }
  if (phase === 'hold'){ G.remain = S.tenseSec; sound.chime(); speak(T('holdSay')); }
  if (phase === 'waitOpen'){ sound.chime(); speak(`${T('releaseSay')} ${st.relax}`); say(pick(T('relaxLines'))); }
  if (phase === 'relax'){ G.remain = S.relaxSec; }
}
function startGuided(){
  F = null;
  G = { i:0, phase:'', t:0, remain:0, paused:false, pausedBySettings:false, label:'', det:null, want:'hand' };
  $('#pauseBtn').hidden = false; $('#skipBtn').hidden = false; $('#spacer').hidden = true;
  beginStep();
}
function nextStep(){
  if (G.i >= STEPS.length - 1){ finishGuided(); return; }
  G.i++; beginStep();
}
function guidedTick(dt, now){
  if (!G || G.paused || G.pausedBySettings || G.phase === 'done') return;
  G.t += dt;
  if (G.phase === 'loadModel'){
    if (modelReady(G.want)) useDet(G.want);
    else if (modelFailed(G.want) || G.t > 15) useDet('hand');       // fall back to the fist signal
    else setCard({label:G.label, main:T('loadingModel', {d:T('detName')[G.want]}), status:''});
    return;
  }
  const st = stepText(), on = subjectOn(now), cb = {label:G.label, det:G.det};
  switch (G.phase){
    case 'calib':
      if (calibTick(dt)){ go('intro'); break; }
      setCard({...cb, main:T('calibMain')[G.det].replaceAll('{name}', buddyName()), status: on ? T('calibrating') : P('show'), soft:true}); break;
    case 'intro':
      if (G.t > 0.8 && fist) go('hold'); else if (G.t > 2.2) go('waitFist');
      setCard({...cb, main:st.tense, status:P('ready')}); break;
    case 'waitFist':
      if (fist) go('hold');
      setCard({...cb, main:st.tense, status: G.t > 12 ? T('tipSens') : P('ready')}); break;
    case 'hold':
      if (fist) G.remain -= dt;
      if (G.remain <= 0 || G.t > S.tenseSec + 15){ go('waitOpen'); break; }   // never get stuck
      setCard({...cb, main:st.tense, status: fist ? T('hold') : P('keep'), count:String(Math.ceil(G.remain)), hot:true}); break;
    case 'waitOpen':
      if ((!fist && fastT < 0.35) || (!on && G.t > 1) || G.t > 5) go('relax');
      setCard({...cb, main:st.relax, status:P('release'), hot:true}); break;
    case 'relax':
      G.remain -= dt;
      if (G.remain <= 0){ nextStep(); break; }

  }
}

  setCard({ label, det:F.det, main:P('free', {name:buddyName()}),
            status: F.cycles ? T('freeStatus', {n:F.cycles}) : P('start'), hot: tension > 0.55 });
}

/* ---------------- Main loop ---------------- */
let lastNow = performance.now(), clock = 0;
function frame(now){
  const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now; clock += dt;
  let t = 0;
  if (!$('#run').hidden){
    if (!DEMO) detect(now);
    updateBaseline(dt);
    const target = computeTarget(now);
    const k = target > tension ? 1 - Math.exp(-dt/0.15) : 1 - Math.exp(-dt/0.8);   // tense fast, relax slowly
    tension += (target - tension) * k;
    fastT += (target - fastT) * (1 - Math.exp(-dt/0.08));
    if (!fist && fastT > 0.6) fist = true; else if (fist && fastT < 0.4) fist = false;
    t = tension;
    updateCharacter(dt, clock, t);
    if (running){ guidedTick(dt, now); freeTick(dt, now); sound.setTension(t); }
    const active = running && ((F && F.phase !== 'load') || (G && ['calib','intro','waitFist','hold'].includes(G.phase)));
    $('#handPillText').textContent = P('show');
    $('#handPill').style.opacity = (active && !subjectOn(now, 1000)) ? 1 : 0;
    drawPreview(now);
  }
  drawBg(dt, clock, t);
  requestAnimationFrame(frame);
}

/* ---------------- Boot ---------------- */
(async () => {
  if (!['puff','mochi','drip','custom'].includes(S.charId)) S.charId = 'puff';
  if (S.charId === 'custom' && !S.customImg) S.charId = 'puff';
  await processCustom().catch(() => {});
  show('home'); renderHome(); updateMuteIcon();
  requestAnimationFrame(frame);
})();
</script>
